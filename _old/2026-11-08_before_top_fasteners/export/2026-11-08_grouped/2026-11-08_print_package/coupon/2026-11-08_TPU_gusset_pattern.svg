<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 297 210"><style>text{font-family:Arial,sans-serif;font-size:3px}.cut{fill:none;stroke:#202830;stroke-width:.25}.weld{fill:none;stroke:#ca7834;stroke-width:.3;stroke-dasharray:1.5 1}.active{fill:none;stroke:#4287a6;stroke-width:.25}</style><text x="12" y="8">TPU gusset-pouch coupon • dimensions in mm • weld geometry and material NOT validated</text><rect class="cut" x="12" y="18" width="80" height="80" rx="10"/><rect class="weld" x="20.0" y="26.0" width="64" height="64" rx="10"/><rect class="active" x="24.0" y="30.0" width="56" height="56" rx="6"/><text x="12" y="103">Lower panel / external dry flange: 80 × 80</text><circle class="cut" cx="16.0" cy="22.0" r="1.4"/><circle class="cut" cx="16.0" cy="94.0" r="1.4"/><circle class="cut" cx="88.0" cy="22.0" r="1.4"/><circle class="cut" cx="88.0" cy="94.0" r="1.4"/><circle class="cut" cx="52.0" cy="22.0" r="2.4"/><circle class="cut" cx="52.0" cy="94.0" r="2.4"/><circle class="active" cx="52.0" cy="58.0" r="10.0"/><rect class="cut" x="112" y="18" width="64" height="64" rx="10"/><rect class="weld" x="112.0" y="18.0" width="64" height="64" rx="10"/><rect class="active" x="116.0" y="22.0" width="56" height="56" rx="6"/><text x="112" y="87">Upper panel: 64 × 64</text><rect class="cut" x="200" y="18" width="80" height="80" rx="10"/><rect class="weld" x="208.0" y="26.0" width="64" height="64" rx="10"/><rect class="active" x="212.0" y="30.0" width="56" height="56" rx="6"/><text x="200" y="103">Dry-flange reinforcement ring: 80 × 80</text><circle class="cut" cx="204.0" cy="22.0" r="1.4"/><circle class="cut" cx="204.0" cy="94.0" r="1.4"/><circle class="cut" cx="276.0" cy="22.0" r="1.4"/><circle class="cut" cx="276.0" cy="94.0" r="1.4"/><circle class="cut" cx="240.0" cy="22.0" r="2.4"/><circle class="cut" cx="240.0" cy="94.0" r="2.4"/><rect class="cut" x="208.0" y="26.0" width="64" height="64" rx="10"/><text x="200" y="109">Remove centre; second dry ply.</text><rect class="cut" x="12" y="123" width="221.699" height="39.000"/><path class="weld" d="M12,127 h221.699 M12,158 h221.699"/><text x="12" y="168.000">Wall strip: 221.70 × 39.00; includes 8 end overlap. Trial assembly required.</text><text x="12" y="183">Orange: weld-land boundary. Blue: active outline / supported port footprint. Black: cut / dry holes.</text><text x="12" y="190">Keep mounting and guide holes outside every airtight seam. Print/export at 100%; verify the 80 mm panel.</text><text x="12" y="197">Blue port circle is a footprint only: make the lower-panel aperture to match the actual fitting.</text></svg>